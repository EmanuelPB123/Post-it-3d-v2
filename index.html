<!DOCTYPE html>
<html>
  <head>
    <title>Post-it AR Pro - Máximo Alcance</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    <style>
      .ui-overlay { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
      .btn { padding: 15px 25px; background: #2196F3; color: white; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; pointer-events: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-family: sans-serif; }
      .btn:disabled { background: #90a4ae; cursor: not-allowed; }
      .action-row { display: none; gap: 10px; }
      .color-grid { display: none; grid-template-columns: repeat(4, 1fr); gap: 10px; background: white; padding: 15px; border-radius: 15px; pointer-events: auto; border: 2px solid #2196F3; }
      .color-dot { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border: 2px solid #eee; }
      #edit-btn { background: #FF9800; }
      #delete-btn { background: #f44336; }
      #close-menu-btn { background: #607D8B; }
      #counter { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); z-index: 1000; background: rgba(0,0,0,0.6); color: white; padding: 6px 14px; border-radius: 20px; font-family: sans-serif; font-size: 14px; }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <div id="counter">0 / 12 notas</div>

    <div class="ui-overlay">
      <div id="grid" class="color-grid">
        <div class="color-dot" style="background: #FFEB3B" onclick="app.setColor('#FFEB3B')"></div>
        <div class="color-dot" style="background: #FF5252" onclick="app.setColor('#FF5252')"></div>
        <div class="color-dot" style="background: #69F0AE" onclick="app.setColor('#69F0AE')"></div>
        <div class="color-dot" style="background: #40C4FF" onclick="app.setColor('#40C4FF')"></div>
      </div>
      <div id="action-row" class="action-row">
        <button id="edit-btn" class="btn" onclick="app.editText()">Editar Texto</button>
        <button id="delete-btn" class="btn" onclick="app.deleteCurrent()">Eliminar</button>
        <button id="close-menu-btn" class="btn" onclick="app.hideMenus()">Cerrar</button>
      </div>
      <button id="add-btn" class="btn" onclick="app.openNew()">+ Nueva Nota</button>
    </div>

    <script>
      const app = {
        notes: JSON.parse(localStorage.getItem('ar-notes-v7') || '[]'),
        selectedId: null,
        marker: null,
        MAX_NOTES: 12,
        WRAP_COUNT: 18, // caracteres aprox. por línea antes de saltar

        init: function() {
          this.marker = document.querySelector('#ancla');
          this.marker.addEventListener('markerFound', () => this.render());
          this.updateCounter();
        },

        // Calcula una grilla que se auto-ajusta según la cantidad total de notas (hasta 12)
        calculateLayout: function(total) {
          const cols = Math.min(4, Math.max(1, Math.ceil(Math.sqrt(total))));
          const rows = Math.ceil(total / cols);
          return { cols, rows };
        },

        calculateGridPosition: function(index, total) {
          const { cols, rows } = this.calculateLayout(total);
          const spacingX = 1.75;
          const spacingZ = 1.75;
          const x = (index % cols) * spacingX - ((cols - 1) * spacingX) / 2;
          const z = Math.floor(index / cols) * spacingZ - ((rows - 1) * spacingZ) / 2;
          return { x: x, y: 0.25, z: z };
        },

        recalculatePositions: function() {
          const total = this.notes.length;
          this.notes = this.notes.map((n, index) => ({
            ...n,
            pos: this.calculateGridPosition(index, total)
          }));
        },

        // Estima cuántas líneas ocupará el texto para dimensionar el post-it
        estimateSize: function(text) {
          const charsPerLine = this.WRAP_COUNT;
          const lines = Math.max(1, Math.ceil(text.length / charsPerLine));
          const width = 1.375;
          const height = Math.min(2.2, Math.max(0.875, 0.45 + lines * 0.24));
          return { width, height, lines };
        },

        updateCounter: function() {
          document.getElementById('counter').textContent = `${this.notes.length} / ${this.MAX_NOTES} notas`;
          document.getElementById('add-btn').disabled = this.notes.length >= this.MAX_NOTES;
        },

        openNew: function() {
          if (this.notes.length >= this.MAX_NOTES) {
            alert(`Alcanzaste el máximo de ${this.MAX_NOTES} notas. Eliminá alguna para agregar otra.`);
            return;
          }
          const text = prompt("Texto de la nota:");
          if (!text) return;
          const id = 'note-' + Date.now();
          this.notes.push({ id: id, text: text, color: '#FFEB3B', pos: { x: 0, y: 0.25, z: 0 } });
          this.recalculatePositions();
          this.save();
        },

        editText: function() {
          const note = this.notes.find(n => n.id === this.selectedId);
          if (!note) return;
          const newText = prompt("Editar texto de la nota:", note.text);
          if (newText === null) return; // cancelado
          if (newText.trim() === '') {
            alert("El texto no puede estar vacío.");
            return;
          }
          note.text = newText;
          this.save();
        },

        select: function(id) {
          this.selectedId = id;
          document.getElementById('grid').style.display = 'grid';
          document.getElementById('action-row').style.display = 'flex';
        },

        setColor: function(color) {
          const note = this.notes.find(n => n.id === this.selectedId);
          if (note) note.color = color;
          this.save();
        },

        deleteCurrent: function() {
          this.notes = this.notes.filter(n => n.id !== this.selectedId);
          this.recalculatePositions();
          this.hideMenus();
          this.save();
        },

        hideMenus: function() {
          this.selectedId = null;
          document.getElementById('grid').style.display = 'none';
          document.getElementById('action-row').style.display = 'none';
        },

        save: function() {
          localStorage.setItem('ar-notes-v7', JSON.stringify(this.notes));
          this.updateCounter();
          this.render();
        },

        render: function() {
          const oldNotes = this.marker.querySelectorAll('.nota-virtual');
          oldNotes.forEach(n => n.parentNode.removeChild(n));

          this.notes.forEach(data => {
            const size = this.estimateSize(data.text);

            const container = document.createElement('a-entity');
            container.setAttribute('class', 'nota-virtual');
            container.setAttribute('position', data.pos);
            container.setAttribute('look-at', '[camera]');

            const bg = document.createElement('a-plane');
            bg.setAttribute('class', 'clickable');
            bg.setAttribute('width', size.width);
            bg.setAttribute('height', size.height);
            bg.setAttribute('color', data.color);
            bg.setAttribute('material', 'shader: flat; side: double');

            const txt = document.createElement('a-text');
            txt.setAttribute('value', data.text);
            txt.setAttribute('align', 'center');
            txt.setAttribute('baseline', 'center');
            txt.setAttribute('color', '#000');
            txt.setAttribute('width', size.width * 2.7);
            txt.setAttribute('wrap-count', this.WRAP_COUNT);
            txt.setAttribute('position', '0 0 0.01');

            // El plano de fondo es el que recibe el rayo del cursor (raycaster objects: .clickable)
            bg.addEventListener('click', () => this.select(data.id));

            container.appendChild(bg);
            container.appendChild(txt);
            this.marker.appendChild(container);
          });
        }
      };
      window.onload = () => app.init();
    </script>

    <a-scene embedded 
             arjs="sourceType: webcam; 
                   sourceWidth:1280; sourceHeight:960; 
                   displayWidth: 1280; displayHeight: 960;
                   debugUIEnabled: false; 
                   detectionMode: mono_and_matrix; 
                   matrixCodeType: 3x3;
                   imageSmoothingEnabled: false;
                   canvasWidth: 1280; canvasHeight: 960;" 
             cursor="rayOrigin: mouse; fuse: false" 
             raycaster="objects: .clickable">
      
      <a-marker preset="hiro" id="ancla" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">
          <a-sphere radius="0.0625" color="red"></a-sphere>
          <a-plane rotation="-90 0 0" width="6.25" height="6.25" color="#fff" opacity="0.1"></a-plane>
      </a-marker>
      
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
